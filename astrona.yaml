# Hands-on course: readings, playgrounds, labs, capstones and quizzes (labs UNTESTED).
training:
  id: ATS071
  title: 'CBA: Backstage Catalog'
  description: 'Reading material, playgrounds, graded labs, capstones and quizzes
    for CBA: Backstage Catalog. Labs model the catalog backend in a kind cluster and
    are untested on a real cluster. Technical content remains draft.'
  certification:
    name: Certified Backstage Associate
    code: CBA
    provider: CNCF / Linux Foundation
    domain: Backstage Catalog
    weight: 22
    competencies:
    - Understand how/why to use Backstage Catalog
    - Populate Backstage Catalog
    - Using annotations
    - Working with manually registered entity locations
    - Troubleshooting entity ingestion
    - Working with automated ingestion
modules:
