apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog-source
data:
  app-config.yaml: |
    catalog:
      locations:
        - type: url
          target: https://git.starfleet.example/starfleet-org/blob/main/org.yaml
          rules:
            - allow: [Group, User]
        - type: url
          target: https://git.starfleet.example/bridge/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/scout/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/probe/blob/main/catalog-info.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-starfleet-org
  namespace: catalog-source
data:
  org.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: starfleet-ops
      description: Operates the bridge service
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: scout-team
      description: Builds the scout website
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: kira
    spec:
      memberOf: [starfleet-ops]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-bridge
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: System
    metadata:
      name: navigation
    spec:
      owner: starfleet-ops
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: bridge
      title: Bridge
      description: Routes requests from the shuttle to the scout
      labels:
        tier: core
      annotations:
        example.com/runbook: https://runbooks.starfleet.example/bridge
      tags: [routing, core]
    spec:
      type: service
      lifecycle: production
      owner: starfleet-ops
      system: navigation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-scout
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: scout
      description: Website that shows scan results
    spec:
      type: website
      lifecycle: experimental
      owner: scout-team
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-probe
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: probe collector
      description: Collects readings from the probe
    spec:
      type: service
      lifecycle: production
      owner: starfleet-ops
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: probe-relay
    spec:
      type: service
      owner: starfleet-ops
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: probe-display
    spec:
      type: website
      lifecycle: experimental
      owner: scout-team
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-shuttle
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: shuttle
      description: Client that sends requests to the bridge
    spec:
      type: service
      lifecycle: production
      owner: starfleet-ops
      dependsOn: [component:default/bridge]
