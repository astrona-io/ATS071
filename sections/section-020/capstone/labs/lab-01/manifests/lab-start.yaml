apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog-source
data:
  app-config.yaml: |
    catalog:
      rules:
        - allow: [Component, API]
      locations:
        - type: url
          target: https://git.starfleet.example/starfleet-org/blob/main/org.yaml
        - type: url
          target: https://git.starfleet.example/ops/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/harbor/blob/main/catalog-info.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-starfleet-org
  namespace: catalog-source
data:
  org.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: dockworkers
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: ops-team
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: mara
    spec:
      memberOf: [dockworkers]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-ops
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Location
    metadata:
      name: ops-index
      description: Lists the service files of the ops repository
    spec:
      targets:
        - ./services.yaml
  services.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: ops-gateway
      description: Entry point for the ops tools
    spec:
      type: service
      lifecycle: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-harbor
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: System
    metadata:
      name: harbor
    spec:
      owner: dockworkers
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: harbor-control
      description: Schedules the docking of ships
    spec:
      type: service
      lifecycle: production
      owner: dockworkers
      system: harbor
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: rogue-admins
    spec:
      type: team
      children: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-dock
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: dock-gate-
      description: Opens and closes the dock doors
    spec:
      type: service
      lifecycle: production
      owner: dockworkers
      providesApis: [dock-api]
    ---
    apiVersion: backstage.io/v1alpha1
    kind: API
    metadata:
      name: dock-api
    spec:
      type: openapi
      owner: dockworkers
      definition: |
        openapi: 3.0.0
        info: {title: dock, version: "1"}
        paths: {}
