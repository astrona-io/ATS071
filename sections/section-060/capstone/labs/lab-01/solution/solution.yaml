apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog-source
data:
  app-config.yaml: |
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Group, User]
      providers:
        github:
          starfleetServices:
            organization: starfleet
            catalogPath: /catalog-info.yaml
            filters:
              branch: main
              repository: '^(?!sandbox-)'
              topic:
                include: [catalog]
                exclude: [deprecated]
              visibility: [public, internal]
            schedule:
              frequency: { minutes: 30 }
              timeout: { minutes: 3 }
