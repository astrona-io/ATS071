apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog-source
data:
  app-config.yaml: |
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Group, User]
      locations:
        - type: url
          target: https://git.starfleet.example/starfleet-org/blob/main/org.yaml
      providers:
        github:
          starfleetServices:
            organization: starfleet
            catalogPath: /catalog.yaml
            filters:
              branch: develop
              topic:
                include: [catalog]
              visibility: [public]
            schedule:
              frequency: { seconds: 20 }
              timeout: { minutes: 3 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-starfleet-org
  namespace: catalog-source
  annotations:
    astrona.io/organization: "starfleet"
    astrona.io/topics: "org"
    astrona.io/visibility: "public"
    astrona.io/default-branch: "main"
data:
  org.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: starfleet-ops
      description: Operates the bridge and shuttle services
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: scout-team
      description: Builds the scout website
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: kira
    spec:
      memberOf: [starfleet-ops]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-bridge
  namespace: catalog-source
  annotations:
    astrona.io/organization: "starfleet"
    astrona.io/topics: "catalog,service"
    astrona.io/visibility: "internal"
    astrona.io/default-branch: "main"
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: bridge
      description: Routes requests from the shuttle to the scout
    spec:
      type: service
      lifecycle: production
      owner: group:default/starfleet-ops
---
