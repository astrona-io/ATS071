apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog-source
data:
  app-config.yaml: |
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Group, User]
      locations:
        - type: url
          target: https://git.starfleet.example/outpost/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/registry/blob/main/catalog-info.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-registry
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Location
    metadata:
      name: starfleet-registry
      description: Root of the Starfleet descriptor tree
    spec:
      targets:
        - ./teams.yaml
        - ./services.yaml
        - https://git.starfleet.example/sensors/blob/main/catalog-info.yaml
  teams.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: fleet-ops
      description: Operates the fleet services
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: sensor-team
      description: Builds the sensor array
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: kira
    spec:
      memberOf: [fleet-ops]
  services.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: helm
      description: Steers the fleet
    spec:
      type: service
      lifecycle: production
      owner: fleet-ops
