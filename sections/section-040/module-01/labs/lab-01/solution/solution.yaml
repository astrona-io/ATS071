apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog-source
data:
  app-config.yaml: |
    catalog:
      locations:
        - type: url
          target: https://git.starfleet.example/bridge/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/scout/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/starfleet-org/blob/main/org.yaml
          rules:
            - allow: [Group, User]
        - type: url
          target: https://git.starfleet.example/fleet-registry/blob/main/catalog-info.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-fleet-registry
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Location
    metadata:
      name: fleet-registry
      description: Lists the descriptor files of the fleet team
    spec:
      targets:
        - ./shuttle.yaml
        - ./cargo.yaml
  shuttle.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: shuttle
      description: Carries crew between the bridge and the outpost
    spec:
      type: service
      lifecycle: production
      owner: fleet-team
  cargo.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: cargo-hauler
      description: Plans cargo loads
    spec:
      type: service
      lifecycle: experimental
      owner: fleet-team
