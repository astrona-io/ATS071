# Knowledge check for section-010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
---
schema_version: 1
kind: question_bank
id: ats071-010
course_id: ATS071
exam_code: CBA
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: section
  id: section-010
  title: Understand how/why to use Backstage Catalog
questions:
- id: ats071-010-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Identify what a catalog entity is and how an entity reference
    is written.
  source_readings:
  - sections/section-010/module-01/course-01-software-entities-ownership-and-discoverable-relationships.md
  prompt: A team wants to point at the Component named `bridge` in the default namespace
    from another descriptor. Which entity reference is correct?
  options:
  - id: a
    text: bridge.default.component
    explanation: Backstage references use the form kind:namespace/name, not dotted
      names.
  - id: b
    text: component:default/bridge
    explanation: Correct. A reference is kind, colon, namespace, slash, name.
  - id: c
    text: default/component/bridge
    explanation: The kind comes first and is followed by a colon, not a slash.
  - id: d
    text: https://git.example/bridge
    explanation: A repository URL is a location, not an entity reference.
  correct_option: b
  explanation: An entity is identified by its kind, namespace and name, written as
    kind:namespace/name.
- id: ats071-010-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Choose the right entity kind for a piece of software or infrastructure.
  source_readings:
  - sections/section-010/module-01/course-01-software-entities-ownership-and-discoverable-relationships.md
  prompt: A service uses a PostgreSQL database that the platform team runs. Which
    kind describes the database?
  options:
  - id: a
    text: Component
    explanation: A Component is a unit of software, such as a service, website or
      library.
  - id: b
    text: System
    explanation: A System groups components, APIs and resources; it is not the database
      itself.
  - id: c
    text: Resource
    explanation: Correct. A Resource describes infrastructure that components depend
      on, such as a database.
  - id: d
    text: API
    explanation: An API describes an interface that a component offers, not the database.
  correct_option: c
  explanation: A Resource is the kind for infrastructure that software uses, and a
    component points at it with dependsOn.
- id: ats071-010-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what the catalog is and is not.
  source_readings:
  - sections/section-010/module-01/course-01-software-entities-ownership-and-discoverable-relationships.md
  prompt: A reader sees the lifecycle value `production` on a Component page and concludes
    that the service is currently healthy. What is wrong with this conclusion?
  options:
  - id: a
    text: The lifecycle field only accepts the value experimental.
    explanation: Lifecycle accepts values such as experimental, production and deprecated.
  - id: b
    text: The field is written by an author, so it states intent and does not measure
      runtime health.
    explanation: Correct. The catalog holds what authors declared, not live status.
  - id: c
    text: Production components are always unhealthy.
    explanation: There is no such rule.
  - id: d
    text: Only the Backstage backend can read lifecycle.
    explanation: Lifecycle is ordinary descriptor data and says nothing about health.
  correct_option: b
  explanation: Descriptor fields are declarations. Health comes from monitoring systems.
- id: ats071-010-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Declare an owner and predict the resulting relation.
  source_readings:
  - sections/section-010/module-01/course-02-ownership-and-relationships.md
  prompt: 'A Component has `owner: starfleet-ops` in its spec and the Group `starfleet-ops`
    exists in the catalog. What relation does the catalog derive for the Component?'
  options:
  - id: a
    text: ownedBy to group:default/starfleet-ops
    explanation: Correct. The owner field produces an ownedBy relation. The Group
      gets the reverse ownerOf relation.
  - id: b
    text: partOf to group:default/starfleet-ops
    explanation: partOf comes from the system field, not from owner.
  - id: c
    text: dependsOn to group:default/starfleet-ops
    explanation: dependsOn is written in the dependsOn field and names software or
      infrastructure.
  - id: d
    text: No relation, because owner is only text.
    explanation: The owner is parsed as an entity reference and becomes a relation.
  correct_option: a
  explanation: spec.owner becomes an ownedBy relation, and the owning entity receives
    the reverse ownerOf relation.
- id: ats071-010-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Diagnose an unresolved relation.
  source_readings:
  - sections/section-010/module-01/course-02-ownership-and-relationships.md
  prompt: The Component `scout` lists `bridge-apis` in `consumesApis` but the API
    is named `bridge-api`. What does the report show?
  options:
  - id: a
    text: scout is rejected because of an invalid name.
    explanation: The name is well formed, so the entity itself is valid.
  - id: b
    text: bridge-api is created automatically.
    explanation: The catalog never creates entities from references.
  - id: c
    text: Nothing, because relations are not checked.
    explanation: Relations are listed and a missing target is reported.
  - id: d
    text: scout is valid, and the relation points at api:default/bridge-apis, which
      does not exist.
    explanation: Correct. The target is unresolved, so the relation leads nowhere.
  correct_option: d
  explanation: A reference to an entity that is not in the catalog is an unresolved
    relation.
- id: ats071-010-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Write a dependsOn reference correctly.
  source_readings:
  - sections/section-010/module-01/course-02-ownership-and-relationships.md
  prompt: A `dependsOn` entry reads `telemetry-db` and the catalog reports an error
    about a missing kind. What is the fix?
  options:
  - id: a
    text: Write resource:default/telemetry-db.
    explanation: Correct. dependsOn has no default kind, so the kind must be written.
  - id: b
    text: Move the entry to the owner field.
    explanation: The owner field names a Group or User.
  - id: c
    text: Rename the Resource to bridge.
    explanation: The name is not the problem; the reference has no kind.
  - id: d
    text: Delete the Resource.
    explanation: Deleting it removes the target and leaves the problem.
  correct_option: a
  explanation: A dependsOn reference needs a kind because the target can be a Component
    or a Resource.
- id: ats071-010-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Group software with System and Domain.
  source_readings:
  - sections/section-010/module-01/course-02-ownership-and-relationships.md
  prompt: Which statement about System and Domain is correct?
  options:
  - id: a
    text: A Component belongs to a System with spec.system, and a System belongs to
      a Domain with spec.domain.
    explanation: Correct. These fields create the partOf relations.
  - id: b
    text: A Domain contains Components directly and has no Systems.
    explanation: A Domain groups Systems.
  - id: c
    text: A System is created by the owner field.
    explanation: A System is its own entity written in a descriptor.
  - id: d
    text: A Domain is required for every Component.
    explanation: The system and domain fields are optional.
  correct_option: a
  explanation: System and Domain are optional grouping entities connected by partOf
    relations.
- id: ats071-010-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Handle two sources that create the same entity.
  source_readings:
  - sections/section-010/module-01/course-03-source-of-truth-freshness-and-adoption.md
  prompt: Two files declare `component:default/bridge`. What is the right fix?
  options:
  - id: a
    text: Restart the backend until the catalog picks the one you want.
    explanation: The result depends on processing order and is not a fix.
  - id: b
    text: Give both files the same description.
    explanation: The identity still conflicts.
  - id: c
    text: Decide which source owns the entity and remove the other declaration.
    explanation: Correct. Each entity reference needs exactly one source.
  - id: d
    text: Raise the lifecycle of one file.
    explanation: Lifecycle does not affect identity.
  correct_option: c
  explanation: Identity conflicts are removed by assigning one source of truth for
    each entity.
- id: ats071-010-q09
  type: single_choice
  difficulty: advanced
  learning_objective: Judge catalog data freshness.
  source_readings:
  - sections/section-010/module-01/course-03-source-of-truth-freshness-and-adoption.md
  prompt: A descriptor passes every check and is ingested, but its owner Group was
    renamed a year ago and the file never changed. Which statement is right?
  options:
  - id: a
    text: The catalog will fix the owner automatically.
    explanation: The catalog does not rewrite descriptors.
  - id: b
    text: Successful ingestion proves the facts are current.
    explanation: Ingestion proves the file is valid, not true.
  - id: c
    text: The entity is stale, and the owner relation is reported as unresolved if
      the old Group is gone.
    explanation: Correct. Valid data can still be wrong, and a missing owner target
      shows as unresolved.
  - id: d
    text: Lifecycle must be set to deprecated.
    explanation: Nothing says the service is deprecated.
  correct_option: c
  explanation: Freshness is an operating task. Teams review descriptors when code
    changes.
- id: ats071-010-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Choose an adoption measure for the catalog.
  source_readings:
  - sections/section-010/module-01/course-03-source-of-truth-freshness-and-adoption.md
  prompt: A manager wants a single number that shows the catalog is working. Which
    measure fits best?
  options:
  - id: a
    text: The count of entities in the catalog.
    explanation: A count measures effort, not value.
  - id: b
    text: The share of real tasks, such as finding an owner during an incident, that
      the catalog answers correctly.
    explanation: Correct. Task success shows whether the data helps people.
  - id: c
    text: The number of YAML files in all repositories.
    explanation: File count says nothing about answers.
  - id: d
    text: The number of Groups.
    explanation: Group count says nothing about service ownership.
  correct_option: b
  explanation: Value is the ability to answer real questions, so tasks are the right
    measure.
- id: ats071-010-q11
  type: single_choice
  difficulty: beginner
  learning_objective: "Name the fields that place a component in a system and a domain."
  source_readings:
  - sections/section-010/module-01/course-04-systems-domains-apis-and-resources.md
  prompt: "Which fields place the component `bridge` in the system `navigation` and the system in the domain `fleet-ops`?"
  options:
  - id: a
    text: "`spec.system` on the component and `spec.domain` on the system."
    explanation: "Correct. Each field names the parent and produces a partOf relation."
  - id: b
    text: "`spec.domain` on the component and `spec.system` on the domain."
    explanation: "The fields sit on the child, and they name the parent of that kind."
  - id: c
    text: "`metadata.labels.system` and `metadata.labels.domain`."
    explanation: "Labels carry no relations."
  - id: d
    text: "`spec.dependsOn` on both entities."
    explanation: "dependsOn describes a dependency, not membership."
  correct_option: a
  explanation: "The child names its parent: the component names its system and the system names its domain."
- id: ats071-010-q12
  type: single_choice
  difficulty: intermediate
  learning_objective: "Read which fields connect a component to an API."
  source_readings:
  - sections/section-010/module-01/course-04-systems-domains-apis-and-resources.md
  prompt: "The component `scout` calls `bridge-api`. Which field of `scout` records this?"
  options:
  - id: a
    text: "`spec.providesApis`"
    explanation: "That field lists APIs that the component offers."
  - id: b
    text: "`spec.consumesApis`"
    explanation: "Correct. It lists the APIs that the component calls."
  - id: c
    text: "`spec.owner`"
    explanation: "The owner is a Group or a User."
  - id: d
    text: "`spec.system`"
    explanation: "The system groups software and does not describe API use."
  correct_option: b
  explanation: "consumesApis records use of an API and produces a consumesApi relation."
- id: ats071-010-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: "Write a correct dependsOn reference."
  source_readings:
  - sections/section-010/module-01/course-04-systems-domains-apis-and-resources.md
  prompt: "The component `bridge` needs the resource `telemetry-db`. Which `dependsOn` entry is safest?"
  options:
  - id: a
    text: "`telemetry-db`"
    explanation: "Without a kind, the reference may be read as a component."
  - id: b
    text: "`resource:default/telemetry-db`"
    explanation: "Correct. A full reference names the kind and avoids a wrong target."
  - id: c
    text: "`db:telemetry-db`"
    explanation: "`db` is not an entity kind."
  - id: d
    text: "`https://git.starfleet.example/telemetry-db`"
    explanation: "A dependsOn entry is an entity reference, not an address."
  correct_option: b
  explanation: "A dependsOn target can be a component or a resource, so the kind belongs in the reference."
- id: ats071-010-q14
  type: single_choice
  difficulty: advanced
  learning_objective: "Tell a validation error from an unresolved relation."
  source_readings:
  - sections/section-010/module-01/course-04-systems-domains-apis-and-resources.md
  prompt: "A `System` sets `domain: fleet-operations`, and no Domain has that name. What does the checker report?"
  options:
  - id: a
    text: "A validation error at the stage `policy`."
    explanation: "Validation does not look up targets."
  - id: b
    text: "A conflict between two locations."
    explanation: "No second declaration exists."
  - id: c
    text: "The system is ingested and an unresolved `partOf` relation is listed."
    explanation: "Correct. The reference is well formed, so only the relation is unresolved."
  - id: d
    text: "A fetch error for the file."
    explanation: "The file was read without problems."
  correct_option: c
  explanation: "A well-formed reference to a missing entity passes validation and leaves an unresolved relation."
- id: ats071-010-q15
  type: single_choice
  difficulty: beginner
  learning_objective: "Name the required fields of a component."
  source_readings:
  - sections/section-010/module-02/course-01-type-and-lifecycle.md
  prompt: "A Component descriptor has `type` and `owner` but no `lifecycle`. What does the checker report?"
  options:
  - id: a
    text: "The component is ingested."
    explanation: "Lifecycle is required."
  - id: b
    text: "An error at the stage `kind` that names the missing property."
    explanation: "Correct."
  - id: c
    text: "A fetch error."
    explanation: "The file was read."
  - id: d
    text: "A conflict."
    explanation: "No second declaration exists."
  correct_option: b
  explanation: "The component schema requires type, lifecycle and owner."
- id: ats071-010-q16
  type: single_choice
  difficulty: beginner
  learning_objective: "Know the common lifecycle values."
  source_readings:
  - sections/section-010/module-02/course-01-type-and-lifecycle.md
  prompt: "Which three lifecycle values does the Backstage documentation name?"
  options:
  - id: a
    text: "`experimental`, `production`, `deprecated`"
    explanation: "Correct."
  - id: b
    text: "`dev`, `test`, `prod`"
    explanation: "These are environments, not documented lifecycle values."
  - id: c
    text: "`new`, `old`, `retired`"
    explanation: "These are not documented values."
  - id: d
    text: "`alpha`, `beta`, `stable`"
    explanation: "These describe API versions."
  correct_option: a
  explanation: "The documented values are experimental, production and deprecated."
- id: ats071-010-q17
  type: single_choice
  difficulty: intermediate
  learning_objective: "Explain why free lifecycle strings cost."
  source_readings:
  - sections/section-010/module-02/course-01-type-and-lifecycle.md
  prompt: "A component has the lifecycle `prod`. What happens?"
  options:
  - id: a
    text: "It fails validation."
    explanation: "Any string is valid."
  - id: b
    text: "It is ingested, and a filter for `production` misses it."
    explanation: "Correct."
  - id: c
    text: "The catalog rewrites it to `production`."
    explanation: "The catalog never rewrites values."
  - id: d
    text: "The catalog marks it deprecated."
    explanation: "The catalog does not infer this."
  correct_option: b
  explanation: "The catalog checks presence, not meaning."
- id: ats071-010-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: "Say which field the owner filter reads."
  source_readings:
  - sections/section-010/module-02/course-02-filtering-the-catalog.md
  prompt: "Which data does the owner filter of the catalog read?"
  options:
  - id: a
    text: "The `ownedBy` relation derived from `spec.owner`."
    explanation: "Correct. Every spelling of the owner matches."
  - id: b
    text: "The text of `metadata.name`."
    explanation: "The name is not the owner."
  - id: c
    text: "The annotation `backstage.io/owner`."
    explanation: "No such annotation is used."
  - id: d
    text: "The label `owner`."
    explanation: "Labels are not used."
  correct_option: a
  explanation: "The filter uses the relation, so full and short references match."
- id: ats071-010-q19
  type: single_choice
  difficulty: beginner
  learning_objective: "Predict a tag filter result."
  source_readings:
  - sections/section-010/module-02/course-02-filtering-the-catalog.md
  prompt: "A component has no `metadata.tags`. Does it appear in a filter for the tag `cargo`?"
  options:
  - id: a
    text: "Yes, an empty list matches all tags."
    explanation: "An empty list matches nothing."
  - id: b
    text: "No, it is not in the result."
    explanation: "Correct."
  - id: c
    text: "Yes, but at the end of the list."
    explanation: "Filters do not rank."
  - id: d
    text: "The filter reports an error."
    explanation: "A missing field gives an empty result, not an error."
  correct_option: b
  explanation: "A filter selects entities that carry the value."
- id: ats071-010-q20
  type: single_choice
  difficulty: intermediate
  learning_objective: "Combine filters."
  source_readings:
  - sections/section-010/module-02/course-02-filtering-the-catalog.md
  prompt: "What does the interface do when you set the owner filter and the lifecycle filter together?"
  options:
  - id: a
    text: "Shows entities that match either filter."
    explanation: "Filters narrow the list."
  - id: b
    text: "Shows entities that match both filters."
    explanation: "Correct."
  - id: c
    text: "Ignores the second filter."
    explanation: "Both apply."
  - id: d
    text: "Shows only deprecated entities."
    explanation: "The lifecycle filter selects the value you set."
  correct_option: b
  explanation: "Filters combine with a logical and."
- id: ats071-010-q21
  type: single_choice
  difficulty: beginner
  learning_objective: "Know what deprecated does."
  source_readings:
  - sections/section-010/module-02/course-03-deprecation-and-impact.md
  prompt: "What does the lifecycle `deprecated` do?"
  options:
  - id: a
    text: "Removes the component from the catalog."
    explanation: "It only signals."
  - id: b
    text: "Blocks new `dependsOn` references."
    explanation: "The catalog does not block dependencies."
  - id: c
    text: "Tells readers to stop starting new uses."
    explanation: "Correct."
  - id: d
    text: "Deletes the registration."
    explanation: "Registrations stay."
  correct_option: c
  explanation: "Deprecated is a signal for people."
- id: ats071-010-q22
  type: single_choice
  difficulty: intermediate
  learning_objective: "Find dependents."
  source_readings:
  - sections/section-010/module-02/course-03-deprecation-and-impact.md
  prompt: "How do you find the dependents of the component `probe`?"
  options:
  - id: a
    text: "Search for entities whose `dependsOn` names `component:default/probe`."
    explanation: "Correct. The catalog also stores the reverse `dependencyOf` relation."
  - id: b
    text: "Read the owner of `probe`."
    explanation: "The owner is not a dependent."
  - id: c
    text: "Read the tags of `probe`."
    explanation: "Tags do not list dependents."
  - id: d
    text: "Read its lifecycle."
    explanation: "The lifecycle lists no dependents."
  correct_option: a
  explanation: "Dependents are the entities that name it in dependsOn."
- id: ats071-010-q23
  type: single_choice
  difficulty: advanced
  learning_objective: "Predict the effect of a removal."
  source_readings:
  - sections/section-010/module-02/course-03-deprecation-and-impact.md
  prompt: "The registration of `probe` is removed while `shuttle` still depends on it. What does the report show?"
  options:
  - id: a
    text: "A validation error for `shuttle`."
    explanation: "The reference is well formed."
  - id: b
    text: "An unresolved `dependsOn` relation from `shuttle`."
    explanation: "Correct."
  - id: c
    text: "A conflict for `probe`."
    explanation: "No second declaration exists."
  - id: d
    text: "Nothing."
    explanation: "The relation points at nothing and is listed."
  correct_option: b
  explanation: "Missing targets leave unresolved relations."
- id: ats071-010-q24
  type: single_choice
  difficulty: intermediate
  learning_objective: "Pick audit checks."
  source_readings:
  - sections/section-010/module-02/course-04-auditing-catalog-quality.md
  prompt: "Which gap does the catalog accept without any error?"
  options:
  - id: a
    text: "A component without `lifecycle`."
    explanation: "This fails validation."
  - id: b
    text: "A component without a description."
    explanation: "Correct. Descriptions are optional."
  - id: c
    text: "A component without a name."
    explanation: "This fails validation."
  - id: d
    text: "A component with a broken YAML file."
    explanation: "This gives a parse error."
  correct_option: b
  explanation: "Optional fields can stay empty and weaken the catalog."
