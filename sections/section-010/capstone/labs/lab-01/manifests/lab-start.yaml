apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog-source
data:
  app-config.yaml: |
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Group, User, Domain]
      locations:
        - type: url
          target: https://git.starfleet.example/yard-org/blob/main/org.yaml
        - type: url
          target: https://git.starfleet.example/gate/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/berth/blob/main/catalog-info.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-yard-org
  namespace: catalog-source
data:
  org.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: yard-ops
      description: Runs the gate service and its database
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: berth-team
      description: Builds the berth board website
    spec:
      type: team
      children: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-gate
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: gate
      description: Opens and closes the shipyard gates
    spec:
      type: service
      lifecycle: production
      owner: yard-ops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-berth
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: berth-board
      description: Website that shows which ship is at which berth
    spec:
      type: website
      lifecycle: production
      owner: berth-team
      consumesApis: [gate-api]
