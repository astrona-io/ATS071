apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-gate
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Domain
    metadata:
      name: logistics
    spec:
      owner: yard-ops
    ---
    apiVersion: backstage.io/v1alpha1
    kind: System
    metadata:
      name: shipyard
    spec:
      owner: yard-ops
      domain: logistics
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: gate
      description: Opens and closes the shipyard gates
    spec:
      type: service
      lifecycle: production
      owner: yard-ops
      system: shipyard
      providesApis: [gate-api]
      dependsOn: [resource:default/dock-db]
    ---
    apiVersion: backstage.io/v1alpha1
    kind: API
    metadata:
      name: gate-api
    spec:
      type: openapi
      lifecycle: production
      owner: yard-ops
      system: shipyard
      definition: |
        openapi: 3.0.0
        info: {title: gate, version: "1"}
        paths: {}
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: dock-db
    spec:
      type: database
      owner: yard-ops
      system: shipyard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-berth
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: berth-board
      description: Website that shows which ship is at which berth
    spec:
      type: website
      lifecycle: production
      owner: berth-team
      system: shipyard
      consumesApis: [gate-api]
