apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  namespace: catalog-source
data:
  app-config.yaml: |
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Group, User, Domain]
      locations:
        - type: url
          target: https://git.starfleet.example/starfleet-org/blob/main/org.yaml
        - type: url
          target: https://git.starfleet.example/bridge/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/scout/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/shuttle/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/probe/blob/main/catalog-info.yaml
        - type: url
          target: https://git.starfleet.example/cargo-hauler/blob/main/catalog-info.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-starfleet-org
  namespace: catalog-source
data:
  org.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: starfleet-ops
      description: Operates the bridge service
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Group
    metadata:
      name: scout-team
      description: Builds the scout website
    spec:
      type: team
      children: []
    ---
    apiVersion: backstage.io/v1alpha1
    kind: User
    metadata:
      name: kira
    spec:
      memberOf: [starfleet-ops]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-bridge
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: System
    metadata:
      name: navigation
    spec:
      owner: starfleet-ops
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: bridge
      description: Routes requests from the shuttle to the scout
    spec:
      type: service
      lifecycle: production
      owner: group:default/starfleet-ops
      system: navigation
      providesApis: [bridge-api]
      dependsOn: [resource:default/telemetry-db]
    ---
    apiVersion: backstage.io/v1alpha1
    kind: API
    metadata:
      name: bridge-api
    spec:
      type: openapi
      lifecycle: production
      owner: starfleet-ops
      system: navigation
      definition: |
        openapi: 3.0.0
        info: {title: bridge, version: "1"}
        paths: {}
    ---
    apiVersion: backstage.io/v1alpha1
    kind: Resource
    metadata:
      name: telemetry-db
    spec:
      type: database
      owner: starfleet-ops
      system: navigation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-scout
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: scout
      description: Website that shows scan results
    spec:
      type: website
      lifecycle: experimental
      owner: scout-team
      consumesApis: [bridge-api]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-shuttle
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: shuttle
      description: Carries cargo between outposts
      tags: [cargo]
    spec:
      type: service
      owner: scout-team
      dependsOn: [component:default/probe]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-probe
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: probe
      description: Old telemetry collector
      tags: [legacy]
    spec:
      type: service
      lifecycle: retired
      owner: starfleet-ops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-cargo-hauler
  namespace: catalog-source
data:
  catalog-info.yaml: |
    apiVersion: backstage.io/v1alpha1
    kind: Component
    metadata:
      name: cargo-hauler
      description: Moves containers inside the outpost
      tags: [cargo]
    spec:
      type: service
      lifecycle: production
      owner: fleet-crew
